name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # When the push creates a new branch (e.g. the very first push), GitHub
        # reports `before` as the all-zero SHA, which is not a valid Git revision.
        # In that case, fall back to Git's magic empty tree hash so the diff range
        # covers the full history instead of failing with "Invalid revision range".
        before: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '4b825dc642cb6eb9a060e54bf8d69288fbee4904' }}
