name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          # GitHub Pages is not enabled for this repository, so deploying the
          # generated documentation would fail with a 404 from the Pages API.
          # Build the docs (for artifact inspection/local use) without
          # attempting to deploy them until Pages is enabled in the repo
          # settings.
          deploy: false
