name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        with:
          # docgen treats an existing homepage folder as a Jekyll site, and the
          # default is "docs", which holds research notes rather than a site.
          # This folder must not exist in the repository: then docgen skips
          # Jekyll and publishes only the API documentation.
          homepage: homepage

  simulation-exchange:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: SimulationExchange
          leanchecker: true
          axiom-audit: true

  ltromino:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: LTromino
          leanchecker: true
          axiom-audit: true
          # Empty allowlist: every LTromino declaration must depend on no axioms.
          # axiom-audit drops blank entries, so "," parses to []; a bare "" could be
          # replaced by the action's default allowlist.
          axiom-audit-allow: ","

  theta-0-photon:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        env:
          # Mathlib dependency: each parallel leanchecker task loads the full
          # import environment, which can exhaust a hosted runner's memory.
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: Theta__0_Photon
          leanchecker: true
          # With no arguments leanchecker looks for modules named after the
          # package, "Theta__0_Photon", and finds none. The library roots are
          # Theta0Photon and Main (see Theta__0_Photon/lakefile.toml).
          leanchecker-args: "Theta0Photon Main"
          axiom-audit: true
