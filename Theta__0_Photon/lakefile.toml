name = "Theta__0_Photon"
version = "0.1.0"
defaultTargets = ["Theta0Photon", "Main"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "SimulationExchange"
path = "../SimulationExchange"

[[lean_lib]]
name = "Theta0Photon"

# Main.lean holds theorems and no `def main`, so it is a library, not an
# executable: linking it as one fails with "undefined symbol: main".
[[lean_lib]]
name = "Main"
